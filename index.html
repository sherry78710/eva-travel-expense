<title>旅遊記帳</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root {
  --bg: #FAFAF8; --card: #FFFFFF;
  --line: #E5E2DA; --line-light: #EFECE4;
  --text: #1C1B19; --sub: #6B6760; --faint: #9E9890;
  --accent: #B8704C; --accent-light: #F5E9E2;
  --green: #4A7A50; --red: #B8453A;
  --btn-text: #fff;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { overflow: hidden; height: 100%; background: var(--bg); }
body { overflow: hidden; height: 100%; background: var(--bg); width: 100%; position: relative; }
input, textarea, select { max-width: 100%; box-sizing: border-box; font-size: 16px; }
input, textarea, select { max-width: 100%; }
* { -webkit-text-size-adjust: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Helvetica Neue", sans-serif; color: var(--text); }
#app { 
  max-width: 480px; 
  margin: 0 auto; 
  height: 100vh;
  height: 100dvh;
  padding-bottom: calc(72px + var(--safe-b)); 
  position: relative; 
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  width: 100%;
  box-sizing: border-box;
}

/* 頁面 */
.page { display: none; padding: 0 24px 32px; width: 100%; box-sizing: border-box; }
.page.active { display: block; }

/* 頁首 */
.page-header { display: flex; align-items: flex-start; justify-content: space-between; padding: 20px 0 16px; position: -webkit-sticky; position: sticky; top: 0; background: var(--bg); z-index: 10; }
.sticky-footer-btn { position: fixed; bottom: calc(72px + var(--safe-b) + 10px); left: 0; right: 0; max-width: 480px; margin: 0 auto; padding: 0 24px; z-index: 40; }
.page-subtitle { font-size: 11px; color: var(--faint); letter-spacing: .12em; margin-bottom: 2px; text-transform: uppercase; }
.page-title { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.back-btn { background: none; border: none; cursor: pointer; color: var(--sub); padding: 4px; margin-left: -8px; margin-top: 2px; display: flex; }

/* 藥丸按鈕 */
.pill { padding: 8px 16px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--sub); font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; white-space: nowrap; transition: all .12s; }
.pill.active { border-color: var(--accent); background: var(--accent-light); color: var(--accent); font-weight: 700; }
.pill.sm { padding: 5px 12px; font-size: 12px; }
.badge-active { background: #E5EEE8; color: var(--green); }
.badge-upcoming { background: #F3E9D8; color: #B98A4A; }
.pill.lg { padding: 11px 22px; font-size: 14px; }
.pill-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* 主要按鈕 */
.btn-primary { width: 100%; padding: 16px; border-radius: 999px; border: none; background: var(--accent); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; letter-spacing: .02em; }
.btn-primary:disabled { background: var(--line-light); color: var(--faint); cursor: default; }
.btn-outline { width: 100%; padding: 14px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--sub); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
.btn-ghost { background: none; border: none; color: var(--faint); font-size: 12px; cursor: pointer; font-family: inherit; text-decoration: underline; }

/* 欄位 */
.field-label { font-size: 11px; color: var(--faint); letter-spacing: .12em; margin-bottom: 8px; text-transform: uppercase; display: block; }
.field-input { width: 100%; border: none; border-bottom: 1px solid var(--line); background: transparent; font-size: 16px; font-weight: 600; color: var(--text); padding: 8px 0; outline: none; font-family: inherit; box-sizing: border-box; max-width: 100%; }
.field-input::placeholder { color: var(--faint); font-weight: 400; }
.field-group { margin-bottom: 20px; }
select.field-input { appearance: none; cursor: pointer; }

/* 分隔線 */
.divider { height: 1px; background: var(--line-light); margin: 20px 0; }

/* 列表行 */
.list-row { display: flex; align-items: center; width: 100%; padding: 14px 0; border-bottom: 1px solid var(--line-light); }

/* 手風琴 */
.accordion { margin-bottom: 10px; border-radius: 16px; border: 1px solid var(--line); overflow: hidden; background: var(--card); }
.accordion-header { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border: none; background: transparent; cursor: pointer; font-family: inherit; }
.accordion-title { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; color: var(--text); }
.accordion-chevron { transition: transform .2s; color: var(--faint); }
.accordion-chevron.open { transform: rotate(180deg); }
.accordion-body { padding: 16px 20px 20px; border-top: 1px solid var(--line-light); display: none; }
.accordion-body.open { display: block; }

/* 底部導覽 */
#bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; max-width: 480px; margin: 0 auto; background: var(--bg); border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 10px 0 calc(10px + var(--safe-b)); z-index: 50; }
.nav-btn { display: flex; flex-direction: column; align-items: center; gap: 5px; background: none; border: none; cursor: pointer; padding: 2px 14px 8px; color: var(--faint); border-bottom: 2px solid transparent; font-family: inherit; }
.nav-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
.nav-btn span { font-size: 10px; font-weight: 400; letter-spacing: .05em; }
.nav-btn.active span { font-weight: 700; }
.nav-btn svg { width: 20px; height: 20px; }

/* Toast */
#toast { position: fixed; bottom: calc(88px + var(--safe-b)); left: 50%; transform: translateX(-50%) translateY(8px); background: var(--text); color: var(--bg); padding: 10px 20px; border-radius: 999px; font-size: 13px; z-index: 300; white-space: nowrap; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(43,42,40,.35); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 24px; }
.modal-box { background: var(--bg); border-radius: 16px; padding: 24px; width: 100%; max-width: 320px; border: 1px solid var(--line); }
.modal-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.modal-msg { font-size: 13px; color: var(--sub); margin-bottom: 24px; line-height: 1.6; }
.modal-actions { display: flex; gap: 24px; justify-content: flex-end; }
.modal-cancel { background: none; border: none; color: var(--sub); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
.modal-confirm { background: none; border: none; color: var(--accent); font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
.modal-confirm.danger { color: var(--red); }

/* 時間軸 */
.timeline { position: relative; padding-left: 20px; }
.timeline::before { content: ''; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 1px; background: var(--line); }
.timeline-item { position: relative; padding-bottom: 20px; }
.timeline-item:last-child { padding-bottom: 0; }
.timeline-dot { position: absolute; left: -20px; top: 4px; width: 9px; height: 9px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--faint); }

/* 進度條 */
.progress-bar { height: 2px; background: var(--line-light); border-radius: 2px; position: relative; margin-bottom: 10px; }
.progress-fill { position: absolute; left: 0; top: 0; height: 2px; border-radius: 2px; background: var(--accent); }
.progress-fill.danger { background: var(--red); }

/* 日曆 */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-day { position: relative; }
.cal-day-btn { width: 100%; aspect-ratio: 1; border: none; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: transparent; font-size: 14px; position: relative; z-index: 1; color: var(--text); }
.cal-day-btn.range-start { background: var(--accent) !important; color: #fff; font-weight: 700; }
.cal-day-btn.range-end { background: var(--accent) !important; color: #fff; font-weight: 700; }
.cal-day-btn.today::after { content: ''; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.cal-day.in-range { background: var(--accent-light); }
.cal-day.range-start-wrap { background: linear-gradient(to right, transparent 50%, var(--accent-light) 50%); }
.cal-day.range-end-wrap { background: linear-gradient(to left, transparent 50%, var(--accent-light) 50%); }

/* 主題卡片 */
.theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.theme-card { padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); cursor: pointer; text-align: left; font-family: inherit; position: relative; }
.theme-card.active { border-color: var(--accent); }
.theme-dots { display: flex; gap: 6px; margin-bottom: 6px; }
.theme-dot { width: 22px; height: 22px; border-radius: 999px; }
.theme-name { font-size: 11px; font-weight: 600; }

/* 代購標籤 */
.purchase-tag { font-size: 10px; color: var(--accent); border: 1px solid var(--accent-light); padding: 1px 6px; border-radius: 999px; flex-shrink: 0; }
.pay-tag { font-size: 10px; font-weight: 600; padding: 1.5px 7px; border-radius: 999px; flex-shrink: 0; white-space: nowrap; }
.pay-tag.cash { background: var(--line-light); color: var(--sub); }
.pay-tag.card { background: var(--accent-light); color: var(--accent); }
.rate-flag { font-size: 9.5px; font-weight: 600; padding: 1.5px 7px; border-radius: 999px; background: var(--accent-light); color: var(--accent); flex-shrink: 0; white-space: nowrap; }
.day-rate-badge { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--line-light); color: var(--sub); }

/* 信用卡回饋列 */
.rebate-row { width: 100%; display: flex; justify-content: space-between; align-items: center; background: #F5F5F3; border-radius: 999px; padding: 8px 14px; margin-bottom: 6px; border: 1.5px solid transparent; cursor: pointer; font-family: inherit; }
.rebate-row.active { background: var(--accent-light); border-color: var(--accent); }

/* 空白狀態 */
.empty-state { padding: 60px 0; text-align: center; }
.empty-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.empty-sub { font-size: 13px; color: var(--sub); line-height: 1.6; margin-bottom: 24px; }

/* 拖曳排序 */
.drag-handle { cursor: grab; padding-right: 10px; color: var(--faint); display: flex; flex-shrink: 0; touch-action: none; }
.drag-row { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line-light); transition: background .1s, opacity .1s; }
.drag-row.dragging { opacity: .35; }
.drag-row.drag-over { background: var(--accent-light); }
.switch-toggle { position: relative; display: inline-block; width: 38px; height: 22px; flex-shrink: 0; cursor: pointer; }
.switch-toggle input { opacity: 0; width: 0; height: 0; }
.switch-toggle span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: background .15s; }
.switch-toggle span::before { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch-toggle input:checked + span { background: var(--accent); }
.switch-toggle input:checked + span::before { left: 18px; }

/* 統計進度條 */
.stat-bar { height: 2px; background: var(--line-light); border-radius: 2px; position: relative; margin-top: 6px; }
.stat-bar-fill { position: absolute; left: 0; top: 0; height: 2px; border-radius: 2px; background: var(--accent); }

/* 匯率輸入 */
.rate-input-row { display: flex; align-items: center; gap: 8px; }
.rate-input { flex: 1; border: none; border-bottom: 1.5px solid var(--accent); background: transparent; font-size: 15px; font-weight: 600; color: var(--text); padding: 4px 0; outline: none; font-family: inherit; }

/* 防止鍵盤彈出時版面偏移與縮放 */
* { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
/* iOS Safari: input font-size < 16px 會自動縮放頁面，強制設為 16px */
input, textarea, select, button { 
  font-size: 16px !important; 
  -webkit-text-size-adjust: 100%;
}
.page-header { width: 100%; box-sizing: border-box; }
</style>
</head>

<script>

'use strict';

// ============================================================
// 常數
// ============================================================
const CURRENCIES = [
  {code:'JPY',name:'日圓',flag:'🇯🇵'},{code:'KRW',name:'韓元',flag:'🇰🇷'},
  {code:'USD',name:'美元',flag:'🇺🇸'},{code:'EUR',name:'歐元',flag:'🇪🇺'},
  {code:'THB',name:'泰銖',flag:'🇹🇭'},{code:'TWD',name:'新台幣',flag:'🇹🇼'},
  {code:'CNY',name:'人民幣',flag:'🇨🇳'},{code:'HKD',name:'港幣',flag:'🇭🇰'},
  {code:'VND',name:'越南盾',flag:'🇻🇳'},{code:'GBP',name:'英鎊',flag:'🇬🇧'},
];
const DEFAULT_CATEGORIES = [
  {id:'food',name:'餐飲',icon:'utensils'},{id:'transport',name:'交通',icon:'train'},
  {id:'shopping',name:'購物',icon:'bag'},{id:'hotel',name:'住宿',icon:'building'},

  {id:'beauty',name:'美妝',icon:'sparkles'},{id:'clothes',name:'衣服',icon:'shirt'},
  {id:'other',name:'其他',icon:'box'},
];
const DEFAULT_PAYMENT_METHODS = [
  {id:'cash',name:'現金',requiresCard:false,core:true},
  {id:'credit',name:'信用卡',requiresCard:true,core:true},
  {id:'fund',name:'公基金',requiresCard:false,core:true},
  {id:'other',name:'其他',requiresCard:false,core:true},
];
function pmRequiresCard(pmId){
  const pm=(DB.paymentMethods||DEFAULT_PAYMENT_METHODS).find(p=>p.id===pmId);
  return pm?!!pm.requiresCard:pmId==='credit';
}
// 明細列表用：回傳 {label, isCash} 給付款方式徽章。
// 需要卡片的付款方式（信用卡、需選卡的電子錢包）顯示卡片名稱；其餘顯示付款方式名稱本身。
function pmBadgeInfo(e){
  const pm=(DB.paymentMethods||DEFAULT_PAYMENT_METHODS).find(p=>p.id===e.payment);
  if(pmRequiresCard(e.payment)&&e.cardId){
    const card=DB.cards.find(c=>c.id===e.cardId);
    return {label:card?.name||pm?.name||'', isCash:false};
  }
  return {label:pm?.name||'', isCash:e.payment==='cash'};
}
const WEEKDAYS = ['日','一','二','三','四','五','六'];

function guessCategoryIcon(name) {
  const n=(name||'').toLowerCase();
  for(const rule of CATEGORY_ICON_RULES) {
    if(rule.keywords.some(k=>n.includes(k.toLowerCase()))) return rule.icon;

const THEMES = {
  A:{name:'燕麥棕 Terracotta',bg:'#FAF8F5',accent:'#B8704C',accentLight:'#F5E9E2'},

let _uid = 0;
function uid(p='id') { return `${p}_${Date.now()}_${++_uid}`; }
function fmtNum(n) { if(n==null||isNaN(n)) return '0'; return Math.round(n).toLocaleString('en-US'); }
function fmtRate(n) { if(!n) return '—'; return parseFloat(n).toFixed(4); }
function todayISO() {
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function nowTime() { const d=new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function getCur(code) { return CURRENCIES.find(c=>c.code===code)||{code,name:'',flag:''}; }
function getRate(trip) { return trip?.lockedRate ?? trip?.currentRate ?? null; }
// 依旅程狀態與日期判斷屬於哪個階段：done(已結束) / upcoming(即將出發) / active(進行中)
function getTripPhase(trip) {
  if(!trip) return 'active';
  if(trip.status==='completed') return 'done';
  const today=todayISO();
  if(trip.startDate && today<trip.startDate) return 'upcoming';
  return 'active';
}
// 完整編輯表單可選的信用卡：攜帶的信用卡 + 其他可選信用卡（例如訂機票用的卡）
function getFormCards(trip) {
  const ids=[...(trip.tripCards||[]),...(trip.extraCards||[])];
  return DB.cards.filter(c=>ids.includes(c.id));
}

function fileToBase64(file) {
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result);
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}

// 把照片壓縮成小尺寸 JPEG base64 再存，避免原圖太大塞爆 localStorage 容量
function compressImageToBase64(file, maxDim=900, quality=0.6) {
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      let {width,height}=img;
      if(width>maxDim||height>maxDim){
        if(width>height){ height=Math.round(height*maxDim/width); width=maxDim; }
        else { width=Math.round(width*maxDim/height); height=maxDim; }
      }
      const canvas=document.createElement('canvas');
      canvas.width=width; canvas.height=height;
      canvas.getContext('2d').drawImage(img,0,0,width,height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('圖片讀取失敗')); };
    img.src=url;
  });
}

// 全螢幕照片檢視（取代 window.open，避免 iOS PWA 下開新分頁失敗）
function openPhotoLightbox(photos, startIdx) {
  closePhotoLightbox();
  if(!photos || !photos.length) return;
  let idx=startIdx||0;
  const overlay=document.createElement('div');
  overlay.id='photo-lightbox-overlay';
  overlay.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);z-index:10000;display:flex;align-items:center;justify-content:center';
  overlay.onclick=function(e){ if(e.target===overlay) closePhotoLightbox(); };

  const img=document.createElement('img');
  img.style.cssText='max-width:92%;max-height:80%;object-fit:contain;border-radius:8px;pointer-events:none';
  img.src=photos[idx];
  overlay.appendChild(img);

  const closeBtn=document.createElement('button');
  closeBtn.innerHTML=ico('x',20,'#fff');
  closeBtn.style.cssText='position:absolute;top:calc(16px + var(--safe-t, 0px));right:16px;width:36px;height:36px;border-radius:999px;background:rgba(255,255,255,.15);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer';
  closeBtn.onclick=function(e){ e.stopPropagation(); closePhotoLightbox(); };
  overlay.appendChild(closeBtn);

  if(photos.length>1){
    const counter=document.createElement('div');
    counter.style.cssText='position:absolute;bottom:calc(20px + var(--safe-b, 0px));left:0;right:0;text-align:center;color:rgba(255,255,255,.75);font-size:12px;font-weight:600';
    counter.textContent=`${idx+1} / ${photos.length}`;
    overlay.appendChild(counter);

    let _tx=null;
    overlay.ontouchstart=function(e){ _tx=e.touches[0].clientX; };
    overlay.ontouchend=function(e){
      if(_tx===null) return;
      const dx=e.changedTouches[0].clientX-_tx;
      _tx=null;
      if(Math.abs(dx)<40) return;
      idx = dx<0 ? Math.min(idx+1, photos.length-1) : Math.max(idx-1, 0);
      img.src=photos[idx];
      counter.textContent=`${idx+1} / ${photos.length}`;
    };
  }

  document.body.appendChild(overlay);
  document.body.style.overflow='hidden';
}
window.openPhotoLightbox=openPhotoLightbox;

function closePhotoLightbox() {
  const overlay=document.getElementById('photo-lightbox-overlay');
  if(overlay) overlay.remove();
  document.body.style.overflow='';
}
window.closePhotoLightbox=closePhotoLightbox;

async function handleExpPhotoAdd(inputEl) {
  const file=inputEl.files?.[0];
  if(!file) return;
  try {
    const base64=await compressImageToBase64(file);
    _efPhotos.push(base64);
    renderEfPhotoSection();
  } catch(e) {
    showToast('照片讀取失敗');
  }
  inputEl.value='';
}
window.handleExpPhotoAdd=handleExpPhotoAdd;

function removeExpPhoto(idx) {
  _efPhotos.splice(idx,1);
  renderEfPhotoSection();
}

async function loginWithSyncCode() {
  const input = document.getElementById('sync-code-input');
  const msg = document.getElementById('sync-login-msg');
  const code = (input.value||'').trim();
  if(!code) { msg.textContent='請輸入同步代碼'; msg.style.color='var(--red)'; return; }

  msg.textContent='連接中...'; msg.style.color='var(--faint)';

  // 如果 Supabase 沒載入，直接用本機資料
  if(!sb) {
    syncCode=code; lsSet('sync_code',code);
    const newUrl=location.pathname+'?code='+encodeURIComponent(code);
    history.replaceState(null,'',newUrl);
    document.getElementById('sync-login').style.display='none';
    document.getElementById('app').style.display='';
    applyTheme(DB.theme); render();
    showToast('已登入（離線模式）');
    return;
  }

  try {
    const { data, error } = await sb.from('app_data').select('data').eq('sync_code', code).maybeSingle();
    if(error) throw error;

    if(data) {
      const cloud = data.data || {};
      DB.trips = cloud.trips || [];
      DB.expenses = cloud.expenses || [];
      DB.cards = cloud.cards || [];
      DB.categories = (cloud.categories && cloud.categories.length) ? cloud.categories : [...DEFAULT_CATEGORIES];
      DB.payees = cloud.payees || [];
      DB.funds = cloud.funds || [];
      DB.theme = cloud.theme || 'A';
      DB.paymentMethods = (cloud.paymentMethods && cloud.paymentMethods.length) ? cloud.paymentMethods : [...DEFAULT_PAYMENT_METHODS];
      ['trips','expenses','cards','categories','payees','funds','theme','paymentMethods'].forEach(k=>lsSet(k,DB[k]));
    } else {
      await sb.from('app_data').insert([{ sync_code: code, data: buildSyncPayload() }]);
    }

    syncCode = code;
    lsSet('sync_code', code);
    const newUrl = location.pathname + '?code=' + encodeURIComponent(code);
    history.replaceState(null, '', newUrl);
    document.getElementById('sync-login').style.display='none';
    document.getElementById('app').style.display='';
    applyTheme(DB.theme);
    render();
    showToast('同步成功！');
  } catch(err) {
    console.error(err);
    const detail = err?.message || err?.error_description || JSON.stringify(err);
    msg.textContent='連接失敗：'+detail;
    msg.style.color='var(--red)';
  }
}

function getCardRebate(card, subId, tripExps, excludeId) {
  const sub = card?.subRates?.find(s=>s.id===subId);
  if (!sub) return null;
  // 解析共用額度群組：錨點＝這個方案自己的共用對象(若有)，否則就是自己；
  // 群組成員＝所有指向同一個錨點的方案（含錨點本身）
  const anchorId = sub.shareWithId || sub.id;
  const anchorSub = card.subRates.find(s=>s.id===anchorId) || sub;
  const groupSubs = (card.subRates||[]).filter(s=>s.id===anchorId||s.shareWithId===anchorId);
  const groupIds = groupSubs.map(s=>s.id);
  const sharing = groupIds.length>1;

  const usedInTrip = (tripExps||[])
    .filter(e=>pmRequiresCard(e.payment)&&e.cardId===card.id&&groupIds.includes(e.subRateId)&&e.id!==excludeId)
    .reduce((s,e)=>{
      const s2=card.subRates.find(x=>x.id===e.subRateId);
      return s+(e.twdAmount||0)*((s2?.rate||0)/100);
    },0);
  const baseUsed = sharing ? groupSubs.reduce((s,x)=>s+(x.used||0),0) : (sub.used||0);
  const totalUsed = baseUsed+usedInTrip;
  // 沒填上限、也沒勾無上限 = 視同沒有設定額度限制，不應該顯示「額度已用完」；共用時以錨點方案的設定為準
  const noCapSet = anchorSub.limit==null || anchorSub.limit==='' || anchorSub.limit<=0;
  const unlimited = !!anchorSub.unlimited || noCapSet;
  const remaining = unlimited ? Infinity : Math.max(0,(anchorSub.limit||0)-totalUsed);
  return {rate:sub.rate,limit:unlimited?Infinity:(anchorSub.limit||0),totalUsed,remaining,unlimited,sharing};
}

function getFundInfo(fund, tripExps, excludeId) {
  const totalIn = (fund?.contributions||[]).reduce((s,c)=>s+(c.amount||0),0);
  const spent = (tripExps||[])
    .filter(e=>e.payment==='fund'&&e.fundId===fund?.id&&e.id!==excludeId)
    .reduce((s,e)=>s+(e.amount||0),0);
  return {totalIn,spent,remaining:totalIn-spent};
}

// 觸控滑動切換分頁
const TABS=['home','exp','add','stats','settings'];
let txStart=null, tyStart=null;
document.getElementById('app').addEventListener('touchstart',e=>{
  txStart=e.touches[0].clientX; tyStart=e.touches[0].clientY;
},{passive:true});
document.getElementById('app').addEventListener('touchend',e=>{
  if(txStart===null) return;
  const dx=e.changedTouches[0].clientX-txStart;
  const dy=e.changedTouches[0].clientY-tyStart;
  const inSub=(currentTab==='home'&&navStack.home!=='list')
    ||(currentTab==='settings'&&navStack.settings!=='main')
    ||(currentTab==='add'&&addSubView!=='quick');
  // 設定子頁面右滑回主頁面
  if(currentTab==='settings'&&navStack.settings!=='main'&&dx>70&&Math.abs(dx)>Math.abs(dy)*2) {
    navStack.settings='main'; render(); txStart=null; tyStart=null; return;
  }
  // 首頁子頁面右滑回列表
  if(currentTab==='home'&&navStack.home!=='list'&&dx>70&&Math.abs(dx)>Math.abs(dy)*2) {
    backFromCreateTrip(); txStart=null; tyStart=null; return;
  }
  // 記帳頁的編輯/補充細節表單右滑返回
  if(currentTab==='add'&&addSubView!=='quick'&&dx>70&&Math.abs(dx)>Math.abs(dy)*2) {
    backFromForm(); txStart=null; tyStart=null; return;
  }
  if(!inSub&&Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*2) {
    const idx=TABS.indexOf(currentTab);
    const next=dx<0?Math.min(idx+1,TABS.length-1):Math.max(idx-1,0);
    switchTab(TABS[next]);
  }
  txStart=null; tyStart=null;
},{passive:true});

function saveTripCash(tripId) {
  const val=document.getElementById(`tf-cashamount-${tripId}`)?.value;
  const amount=val?parseFloat(val):null;
  DB.trips=DB.trips.map(t=>t.id===tripId?{...t,cashAmount:amount}:t);
  save('trips');
  showToast('攜帶現金已儲存');
  const trip=DB.trips.find(t=>t.id===tripId);
  const cur=getCur(trip.currency);
  const badge=document.getElementById(`cash_${tripId}-badge`);
  if(badge) badge.textContent=amount?`${cur.code} ${fmtNum(amount)}`:'未設定';
  renderTripList();
}
window.saveTripCash=saveTripCash;

// 換匯：只增加「攜帶現金」餘額，不建立消費紀錄、不影響統計
function addTripExchange(tripId) {
  const twdOut=parseFloat(document.getElementById(`tf-exout-${tripId}`)?.value);
  const foreignIn=parseFloat(document.getElementById(`tf-exin-${tripId}`)?.value);
  if(!twdOut||!foreignIn){showToast('請輸入換出與換入金額');return;}
  DB.trips=DB.trips.map(t=>{
    if(t.id!==tripId) return t;
    const record={id:uid('ex'),date:todayISO(),twdOut,foreignIn};
    return {...t,cashAmount:(t.cashAmount||0)+foreignIn,cashExchanges:[...(t.cashExchanges||[]),record]};
  });
  save('trips');
  showToast('已加到攜帶現金');
  renderTripList();
}

  const chev=document.getElementById(`${id}-acc-chev`);
  if(!body) return;
  const isOpen=body.style.display!=='none';
  body.style.display=isOpen?'none':'block';

  _accOpenState[id]=!isOpen;
}

// 攜帶的信用卡 / 其他可選信用卡：直接對指定旅程即時存檔（首頁卡片用）
function toggleTripCard(tripId, cardId) {
  const trip=DB.trips.find(t=>t.id===tripId);
  if(!trip) return;
  const arr=[...(trip.tripCards||[])];
  const idx=arr.indexOf(cardId);
  if(idx>=0) arr.splice(idx,1); else arr.push(cardId);
  DB.trips=DB.trips.map(t=>t.id===tripId?{...t,tripCards:arr}:t);
  save('trips');
  const badge=document.getElementById(`cards-acc-badge-${tripId}`);
  if(badge) badge.textContent=arr.length?arr.length+'張':'未選';
  document.querySelectorAll(`#trip-cards-pills-${tripId} .pill`).forEach(btn=>{
    btn.classList.toggle('active',arr.includes(btn.dataset.cardId));
  });
}
window.toggleTripCard=toggleTripCard;

function toggleTripExtraCard(tripId, cardId) {
  const trip=DB.trips.find(t=>t.id===tripId);
  if(!trip) return;
  const arr=[...(trip.extraCards||[])];
  const idx=arr.indexOf(cardId);
  if(idx>=0) arr.splice(idx,1); else arr.push(cardId);
  DB.trips=DB.trips.map(t=>t.id===tripId?{...t,extraCards:arr}:t);
  save('trips');
  document.querySelectorAll(`#trip-extra-cards-pills-${tripId} .pill`).forEach(btn=>{
    btn.classList.toggle('active',arr.includes(btn.dataset.cardId));
  });
}
window.toggleTripExtraCard=toggleTripExtraCard;

function backFromCreateTrip() {

  navStack.home='list';
  render();
}
window.backFromCreateTrip=backFromCreateTrip;

function toggleCal() {
  let overlay=document.getElementById('cal-overlay');
  if(!overlay){
    overlay=document.createElement('div');
    overlay.id='cal-overlay';
    overlay.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(43,42,40,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box';
    overlay.onclick=function(e){ if(e.target===overlay) closeCal(); };
    const inner=document.createElement('div');
    inner.style.cssText='width:100%;max-width:360px';
    inner.addEventListener('touchmove',function(e){ e.preventDefault(); },{passive:false});
    let _tx=null,_ty=null;
    inner.addEventListener('touchstart',function(e){ _tx=e.touches[0].clientX; _ty=e.touches[0].clientY; },{passive:true});
    inner.addEventListener('touchend',function(e){
      if(_tx===null) return;
      const dx=e.changedTouches[0].clientX-_tx;
      const dy=e.changedTouches[0].clientY-_ty;
      _tx=null; _ty=null;
      if(Math.abs(dx)<40||Math.abs(dy)>Math.abs(dx)) return;
      calNav(dx<0?1:-1);
    },{passive:true});
    const calContainer=document.getElementById('cal-container');
    inner.appendChild(calContainer);
    overlay.appendChild(inner);
    document.body.appendChild(overlay);
  }
  const calContainer=document.getElementById('cal-container');
  calContainer.style.display='block';
  calContainer.innerHTML=buildCal();
  document.getElementById('cal-overlay').style.display='flex';
  document.body.style.overflow='hidden';
}
window.toggleCal=toggleCal;

function closeCal(){
  const overlay=document.getElementById('cal-overlay');
  if(overlay) overlay.style.display='none';
  document.body.style.overflow='';
}
window.closeCal=closeCal;

// ---- 日曆 ----
function buildCal() {
  const y=calViewYear, m=calViewMonth;
  const daysInMonth=new Date(y,m+1,0).getDate();
  const firstDay=new Date(y,m,1).getDay();
  const offset=firstDay===0?6:firstDay-1;
  const today=todayISO();
  const monthNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const toISO=(d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

  const headerHtml=`
    <div style="background:var(--card);border-radius:20px;overflow:hidden;border:1px solid var(--line)">
      <div style="padding:14px 16px 10px;border-bottom:1px solid var(--line-light)">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="flex:1">
            <div style="font-size:11px;color:var(--faint);margin-bottom:2px">${calSelecting==='start'?'▶ 出發日':'出發日'}</div>
            <div style="font-size:17px;font-weight:700;color:${calStart?'var(--text)':'var(--faint)'}">${calStart?calStart.slice(5).replace('-','/'):'點選日期'}</div>
          </div>
          <span style="color:var(--faint)">${ico('forward',16)}</span>
          <div style="flex:1;text-align:right">
            <div style="font-size:11px;color:var(--faint);margin-bottom:2px">${calSelecting==='end'?'▶ 回程日':'回程日'}</div>
            <div style="font-size:17px;font-weight:700;color:${calEnd&&calEnd!==calStart?'var(--text)':'var(--faint)'}">${calEnd&&calEnd!==calStart?calEnd.slice(5).replace('-','/'):'點選日期'}</div>
          </div>
        </div>
        ${calSelecting==='end'?`<div style="font-size:11px;color:var(--accent);margin-top:8px;text-align:center">再點一下選擇回程日</div>`:''}
      </div>
      <div style="padding:12px 14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <button onclick="calNav(-1)" style="width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center">${ico('back',16)}</button>
          <span style="font-size:15px;font-weight:700">${y}年 ${monthNames[m]}</span>
          <button onclick="calNav(1)" style="width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center">${ico('forward',16)}</button>
        </div>
        <div class="cal-grid" style="margin-bottom:4px">
          ${['一','二','三','四','五','六','日'].map(d=>`<div style="text-align:center;font-size:11px;color:var(--faint);padding:4px 0">${d}</div>`).join('')}
        </div>
        <div class="cal-grid">
          ${Array.from({length:offset}).map(()=>'<div></div>').join('')}
          ${Array.from({length:daysInMonth}).map((_,i)=>{
            const day=i+1;
            const iso=toISO(day);
            const isStart=iso===calStart;
            const isEnd=iso===calEnd;
            const inRange=calStart&&calEnd&&iso>calStart&&iso<calEnd;
            const isToday=iso===today;
            const single=calStart===calEnd;
            let wrapClass='cal-day';
            if(isStart&&!single) wrapClass+=' range-start-wrap';
            else if(isEnd&&!single) wrapClass+=' range-end-wrap';
            else if(inRange) wrapClass+=' in-range';
            let btnClass='cal-day-btn';
            if(isStart||isEnd) btnClass+=' '+(isStart?'range-start':'range-end');
            if(isToday&&!isStart&&!isEnd) btnClass+=' today';
            return `<div class="${wrapClass}"><button class="${btnClass}" onclick="calSelectDay('${iso}')">${day}</button></div>`;
          }).join('')}
        </div>
      </div>
      <div style="padding:0 14px 14px">
        <button onclick="calConfirm()" class="btn-primary" style="background:${calStart&&calEnd?'var(--accent)':'var(--line-light)'};color:${calStart&&calEnd?'#fff':'var(--faint)'}">
          ${calStart&&calEnd&&calStart!==calEnd?`確定（${daysBetween(calStart,calEnd)} 天）`:calStart?'再選回程日':'請選擇日期'}
        </button>
      </div>
    </div>`;

function calConfirm() {
  if(!calStart||!calEnd) return;
  const days=daysBetween(calStart,calEnd);

  // 若是在首頁卡片編輯某趟既有旅程的日期，直接存檔（日期改變可能讓卡片換組，所以重繪整個首頁）
  if(_calEditingTripId) {
    const tripId=_calEditingTripId;
    DB.trips=DB.trips.map(t=>t.id===tripId?{...t,startDate:calStart,endDate:calEnd}:t);

    calStart=null;calEnd=null;_calEditingTripId=null;

  const trigger=document.getElementById('cal-trigger');

            <div style="font-size:15px;font-weight:700;color:${calEnd&&calEnd!==calStart?'var(--text)':'var(--faint)'}">${calEnd&&calEnd!==calStart?calEnd.slice(5).replace('-','/'):'選擇'}</div>

let _rateFetching = false;
const _autoFetchedKey = new Set(); // 避免同一旅程同一天重複自動抓取

function rateCacheKey(code) { return `tv_rate_${code}_${todayISO()}`; }

async function fetchRateFromAPI(fromCode) {
  const from = fromCode.toLowerCase();
  // 來源 1：fawazahmed0/currency-api（免費、支援 200+ 貨幣含 TWD、無需 Key）
  try {
    const res = await fetch(`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/${from}.min.json`);
    if (res.ok) {
      const data = await res.json();
      const rate = data?.[from]?.twd;
      if (rate && !isNaN(rate)) return rate;
    }
  } catch (e) {}
  // 來源 1 備援鏡像（同一資料源的另一個網域，避免 jsdelivr 偶發性掛掉）
  try {
    const res = await fetch(`https://latest.currency-api.pages.dev/v1/currencies/${from}.min.json`);
    if (res.ok) {
      const data = await res.json();
      const rate = data?.[from]?.twd;
      if (rate && !isNaN(rate)) return rate;
    }
  } catch (e) {}
  // 來源 2：open.er-api.com（免費、無需 Key，作為最終備援）
  const res = await fetch(`https://open.er-api.com/v6/latest/${encodeURIComponent(fromCode)}`);
  if (!res.ok) throw new Error('rate api error');
  const data = await res.json();
  const rate = data?.rates?.TWD;
  if (!rate || isNaN(rate)) throw new Error('rate not found');
  return rate;
}

async function autoFetchRate(tripId, silent=false) {
  const trip = DB.trips.find(t=>t.id===tripId);
  if (!trip || trip.lockedRate) return;
  if (_rateFetching) return;
  _rateFetching = true;
  const btn = document.getElementById('rate-auto-btn');
  if (btn && !silent) { btn.style.opacity='0.5'; btn.style.pointerEvents='none'; }

  try {
    const rate = await fetchRateFromAPI(trip.currency);
    // 快取今天已抓過，避免同一天重複打 API
    try { localStorage.setItem(rateCacheKey(trip.currency), String(rate)); } catch(e){}
    DB.trips = DB.trips.map(t=>t.id===tripId?{...t, currentRate:rate, rateSource:'auto', rateFetchedAt:todayISO()}:t);
    save('trips');
    if (!silent) showToast(`已自動抓取匯率：1 ${trip.currency} ≈ TWD ${fmtRate(rate)}`);
    reRenderAfterRateChange(tripId);
  } catch (err) {
    if (!silent) showToast('自動抓取匯率失敗，請改用手動輸入或檢查網路連線');
  } finally {
    _rateFetching = false;
    if (btn) { btn.style.opacity='1'; btn.style.pointerEvents='auto'; }
  }
}
window.autoFetchRate = autoFetchRate;

// 進入明細頁時，若尚未設定匯率，靜默嘗試自動抓取一次；若匯率是「自動抓取」的，
// 且不是今天抓的，也會靜默重新抓一次最新匯率（同一旅程同一天只嘗試一次）
function maybeAutoFetchOnOpen(trip) {
  if (!trip || trip.status!=='active' || trip.lockedRate) return;
  const key = trip.id + '_' + todayISO();
  if (_autoFetchedKey.has(key)) return;
  _autoFetchedKey.add(key);
  if (trip.currentRate) {
    // 手動輸入的匯率永遠不會被自動覆蓋；自動抓取的匯率則每天重抓一次
    if (trip.rateSource!=='auto') return;
    if (trip.rateFetchedAt===todayISO()) return; // 今天已經抓過了
  }
  // 先看今天是否已經快取過這個幣別的匯率，有的話直接用，不必打 API
  try {
    const cached = localStorage.getItem(rateCacheKey(trip.currency));
    if (cached) {
      DB.trips = DB.trips.map(t=>t.id===trip.id?{...t, currentRate:parseFloat(cached), rateSource:'auto'}:t);
      save('trips');
      renderExpList();
      return;
    }
  } catch(e){}
  autoFetchRate(trip.id, true);
}

function setQPayment(pm, tripId) {
  if(qPayment===pm) {
    qPayment=null; qSelectedCardId=null; qSelectedSubRateId=null;
    document.querySelectorAll('[id^="qpm-"]').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.rebate-row').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('[id^="rebate-subs-"]').forEach(c=>c.innerHTML='');
    const cp=document.getElementById('q-cash-panel'); if(cp) cp.style.display='none';
    const crp=document.getElementById('q-credit-panel'); if(crp) crp.style.display='none';
    updateQTwd(qTripId);
    return;
  }
  qPayment=pm; if(!pmRequiresCard(pm)){ qSelectedCardId=null; qSelectedSubRateId=null; document.querySelectorAll('.rebate-row').forEach(b=>b.classList.remove('active')); document.querySelectorAll('[id^="rebate-subs-"]').forEach(c=>c.innerHTML=''); }
  document.querySelectorAll('[id^="qpm-"]').forEach(b=>b.classList.toggle('active',b.id===`qpm-${pm}`));
  const cp=document.getElementById('q-cash-panel'); if(cp) cp.style.display=pm==='cash'?'flex':'none';
  const crp=document.getElementById('q-credit-panel'); if(crp) crp.style.display=pmRequiresCard(pm)?'block':'none';
  // 若已透過上方回饋列選了卡片，開啟面板時把 pill 狀態與方案清單同步回來
  if(pmRequiresCard(pm)&&qSelectedCardId){
    document.querySelectorAll('[id^="qcard-"]').forEach(b=>b.classList.toggle('active',b.id===`qcard-${qSelectedCardId}`));
    const card=DB.cards.find(c=>c.id===qSelectedCardId);
    const qcardSubs=document.getElementById('qcard-subs');
    if(qcardSubs&&(card?.subRates||[]).length>1) qcardSubs.innerHTML=buildQSubRateList(card);
  }
  updateQTwd(qTripId);
}

function selectQCard(cardId) {
  const wasSelected=qSelectedCardId===cardId;
  qSelectedCardId=wasSelected?null:cardId;
  document.querySelectorAll('[id^="qcard-"]').forEach(b=>b.classList.toggle('active',b.id===`qcard-${cardId}`&&qSelectedCardId===cardId));
  // 同步頂部回饋列的選取狀態（兩處共用同一個 qSelectedCardId）
  document.querySelectorAll('.rebate-row').forEach(btn=>{
    const cid=btn.id.replace('rebate-','');
    btn.classList.toggle('active',cid===qSelectedCardId);
  });
  document.querySelectorAll('[id^="rebate-subs-"]').forEach(c=>c.innerHTML='');
  const subsContainer=document.getElementById('qcard-subs');
  if(subsContainer) subsContainer.innerHTML='';
  qSelectedSubRateId=null;
  if(!wasSelected&&qSelectedCardId) {
    const card=DB.cards.find(c=>c.id===qSelectedCardId);
    const subs=card?.subRates||[];
    if(subs.length>1) {
      const best=subs.map(s=>({s,info:getCardRebate(card,s.id,[],null)})).filter(x=>x.info.remaining>0).sort((a,b)=>b.s.rate-a.s.rate)[0]||{s:subs[0]};
      qSelectedSubRateId=best.s.id;
      if(subsContainer) subsContainer.innerHTML=buildQSubRateList(card);
    } else if(subs.length===1) {
      qSelectedSubRateId=subs[0].id;
    }
  }
  updateQTwd(qTripId);
}

function tightestCappedSub(card) {
  const subs=card.subRates||[];
  const capped=subs.map(s=>({s,info:getCardRebate(card,s.id,[],null)})).filter(x=>x.info&&isFinite(x.info.remaining));
  if(!capped.length) return null;
  return capped.sort((a,b)=>a.info.remaining-b.info.remaining)[0];
}

function updateQTwd(tripId) {
  const trip=DB.trips.find(t=>t.id===tripId);
  const rate=getRate(trip);
  const amt=parseFloat(document.getElementById('q-amount')?.value)||0;
  const twd=qCurrency==='TWD'?amt:amt*(rate||1);
  const el=document.getElementById('q-twd');
  if(el) el.textContent=amt&&qCurrency!=='TWD'&&rate?`≈ NT$ ${fmtNum(twd)}`:'';
  // 即時顯示每張信用卡狀態（只有有限額、有列出預覽列的卡才更新）
  const tripCards=DB.cards.filter(c=>(trip.tripCards||[]).includes(c.id));
  tripCards.forEach(card=>{
    const estEl=document.getElementById(`rebate-est-${card.id}`);
    const statusEl=document.getElementById(`rebate-status-${card.id}`);
    const subs=card.subRates||[];
    if(!subs.length) return;
    // 若使用者已選定此卡＋方案，用選定的；否則用「有限額中剩餘最少」的方案（與預覽列一致）
    const useSelected=qSelectedCardId===card.id&&qSelectedSubRateId&&subs.some(s=>s.id===qSelectedSubRateId);
    const chosenSub=useSelected?subs.find(s=>s.id===qSelectedSubRateId):tightestCappedSub(card)?.s;
    if(chosenSub&&(estEl||statusEl)){
      const info=getCardRebate(card,chosenSub.id,[],null);
      const remaining=info.remaining;
      if(amt>0&&twd>0){
        const isOver=twd>remaining;
        const est=isOver?remaining:Math.min(twd*(chosenSub.rate/100),remaining);
        if(estEl){
          estEl.textContent=isOver?`⚠️ 超過NT$${fmtNum(twd-remaining)}`:`+NT$${fmtNum(est)}`;
          estEl.style.color=isOver?'var(--red)':'var(--green)';
        }
        if(statusEl){
          statusEl.textContent=isOver
            ?`剩餘額度 NT$${fmtNum(remaining)}｜這筆超出 NT$${fmtNum(twd-remaining)}`
            :`刷後剩餘 NT$${fmtNum(remaining-twd)}`;
          statusEl.style.color=isOver?'var(--red)':'var(--faint)';
        }
      } else {
        if(estEl){ estEl.textContent=''; estEl.style.color=''; }
        if(statusEl){ statusEl.textContent=`剩餘額度 NT$${fmtNum(remaining)}`; statusEl.style.color=''; }
      }
    }
    // 同步更新展開中的方案清單各自的剩餘額度顯示
    if(qSelectedCardId===card.id&&subs.length>1){
      subs.forEach(sub=>{
        const remSpan=document.getElementById(`q-sub-rem-${sub.id}`);
        if(!remSpan) return;
        const subInfo=getCardRebate(card,sub.id,[],null);
        remSpan.textContent=subInfo.remaining<=0?'額度已用完':`剩 NT$${fmtNum(subInfo.remaining)}`;
        remSpan.style.color=subInfo.remaining<=0?'var(--red)':'var(--faint)';
      });
    }
  });
}
window.updateQTwd=updateQTwd;

function toggleRebateCard(cardId) {
  const wasSelected=qSelectedCardId===cardId;
  qSelectedCardId=wasSelected?null:cardId;
  qPayment=qSelectedCardId?'credit':'cash';
  document.querySelectorAll('.rebate-row').forEach(btn=>{
    const cid=btn.id.replace('rebate-','');
    btn.classList.toggle('active',cid===qSelectedCardId);
  });
  document.querySelectorAll('[id^="qpm-"]').forEach(btn=>{
    btn.classList.toggle('active',btn.id===`qpm-${qPayment}`);
  });
  // 同步底部「支付方式→信用卡」面板的顯示與卡片選取狀態
  const crp=document.getElementById('q-credit-panel'); if(crp) crp.style.display=pmRequiresCard(qPayment)?'block':'none';
  document.querySelectorAll('[id^="qcard-"]').forEach(b=>b.classList.toggle('active',b.id===`qcard-${qSelectedCardId}`));
  const qcardSubs=document.getElementById('qcard-subs'); if(qcardSubs) qcardSubs.innerHTML='';
  // 清空所有卡片的方案選單，只留下（如果有）目前選中卡片的
  document.querySelectorAll('[id^="rebate-subs-"]').forEach(c=>c.innerHTML='');
  qSelectedSubRateId=null;
  if(!wasSelected&&qSelectedCardId) {
    const card=DB.cards.find(c=>c.id===qSelectedCardId);
    const subs=card?.subRates||[];
    if(subs.length>1) {
      const best=subs.map(s=>({s,info:getCardRebate(card,s.id,[],null)})).filter(x=>x.info.remaining>0).sort((a,b)=>b.s.rate-a.s.rate)[0]||{s:subs[0]};
      qSelectedSubRateId=best.s.id;
      const container=document.getElementById(`rebate-subs-${card.id}`);
      if(container) container.innerHTML=buildQSubRateList(card);
      if(qcardSubs) qcardSubs.innerHTML=buildQSubRateList(card);
    } else if(subs.length===1) {
      qSelectedSubRateId=subs[0].id;
    }
  }
  updateQTwd(qTripId);
}
window.toggleRebateCard=toggleRebateCard;

function buildQSubRateList(card) {

        style="display:flex;align-items:center;gap:10px;width:100%;background:${isActive?'var(--accent-light)':'none'};border:1.5px solid ${isActive?'var(--accent)':'var(--line-light)'};border-radius:10px;cursor:pointer;padding:8px 10px;margin-top:6px;font-family:inherit;text-align:left;opacity:${info.remaining<=0?.5:1}">

function selectQSubRate(cardId,subId) {

function quickSave(tripId) {
  const trip=DB.trips.find(t=>t.id===tripId);
  const amt=parseFloat(document.getElementById('q-amount')?.value);
  if(!amt||amt<=0){showToast('請輸入金額');return;}
  const rate=getRate(trip);
  const twd=qCurrency==='TWD'?amt:amt*(rate||1);
  const catId=qCatId||null;
  const payment=qPayment||'cash';

  let subRateId=null;
  if(pmRequiresCard(payment)&&qSelectedCardId) {
    const card=DB.cards.find(c=>c.id===qSelectedCardId);
    const subs=card?.subRates||[];
    if(qSelectedSubRateId&&subs.some(s=>s.id===qSelectedSubRateId)) {
      subRateId=qSelectedSubRateId;
    } else if(subs.length) {
      const best=subs.map(s=>({s,info:getCardRebate(card,s.id,[],null)})).sort((a,b)=>b.s.rate-a.s.rate)[0];
      subRateId=best?.s.id||null;
    }
  }

  DB.expenses.push({
    id:uid('exp'), tripId,
    amount:amt, currency:qCurrency, twdAmount:twd,
    name:document.getElementById('q-name')?.value.trim()||'',
    date:document.getElementById('q-date')?.value||todayISO(),
    time:document.getElementById('q-time')?.value||nowTime(),
    categoryId:catId,
    payment,
    cardId:pmRequiresCard(payment)?qSelectedCardId:null,
    subRateId,
    fundId:null,
    store:document.getElementById('q-store')?.value.trim()||'',
    location:document.getElementById('q-location')?.value.trim()||'',
    note:document.getElementById('q-note')?.value.trim()||'',
    isPurchaseFor:false, purchaseForId:null,
    rateAtRecord:rate,
    photos:qPhotos,
    createdAt:Date.now(),
  });
  save('expenses');
  document.getElementById('q-amount').value='';
  document.getElementById('q-name').value='';
  document.getElementById('q-twd').textContent='';
  showToast('已記錄！');
  renderQuickPanel(trip);
}
window.quickSave=quickSave;

function expandToForm(tripId) {

  return `<div style="padding-left:16px;border-left:2px solid var(--line-light)">
    <div class="pill-row" style="margin-bottom:10px">
      ${tripFunds.map(f=>`<button class="pill sm ${defFundId===f.id?'active':''}" id="ef-fund-${f.id}" onclick="selectEfFund('${f.id}')">${f.name}</button>`).join('')}
    </div>
    ${defFundId?`<div style="display:flex;justify-content:space-between"><span style="font-size:12px;color:var(--sub);font-weight:600">基金剩餘</span><span style="font-size:16px;font-weight:700">${currency} ${fmtNum(getFundInfo(tripFunds.find(f=>f.id===defFundId),tripExps,excludeId).remaining)}</span></div>`:''}
  </div>`;
}

function calcRebate(card,subId,amt,rate,cur,tripExps,excludeId) {
  if(!card||!subId||!amt) return 0;
  const twd=cur==='TWD'?amt:amt*(rate||1);
  const info=getCardRebate(card,subId,tripExps,excludeId);
  if(!info) return 0;
  return Math.min(twd*(info.rate/100),info.remaining);
}

function submitExpense(tripId,existingId) {
  const trip=DB.trips.find(t=>t.id===tripId);
  const amt=parseFloat(document.getElementById('ef-amount')?.value);
  if(!amt||amt<=0){showToast('請輸入金額');return;}
  const rate=getRate(trip);
  const cur=_efCur||(existingId?DB.expenses.find(e=>e.id===existingId)?.currency:trip.currency)||trip.currency;
  const twd=cur==='TWD'?amt:amt*(rate||1);
  const catId=_efCatId||(existingId?DB.expenses.find(e=>e.id===existingId)?.categoryId:null)||DB.categories[0]?.id;
  const payment=_efPayment||(existingId?DB.expenses.find(e=>e.id===existingId)?.payment:null)||'cash';
  const cardId=pmRequiresCard(payment)?(_efCardId||(existingId?DB.expenses.find(e=>e.id===existingId)?.cardId:null)):null;
  const subRateId=pmRequiresCard(payment)?(_efSubRateId||(existingId?DB.expenses.find(e=>e.id===existingId)?.subRateId:null)):null;
  const fundId=payment==='fund'?(_efFundId||(existingId?DB.expenses.find(e=>e.id===existingId)?.fundId:null)):null;

  const expense={
    id:existingId||uid('exp'), tripId,
    amount:amt, currency:cur, twdAmount:twd,
    name:document.getElementById('ef-name')?.value.trim()||'',
    date:document.getElementById('ef-date')?.value||todayISO(),
    time:document.getElementById('ef-time')?.value||nowTime(),
    categoryId:catId, payment, cardId, subRateId, fundId,
    store:document.getElementById('ef-store')?.value.trim()||'',
    location:document.getElementById('ef-location')?.value.trim()||'',
    note:document.getElementById('ef-note')?.value.trim()||'',
    isPurchaseFor:document.getElementById('ef-ispurchase')?.checked||false,
    purchaseForId:_efPurchaseForId||(existingId?DB.expenses.find(e=>e.id===existingId)?.purchaseForId:null)||null,
    rateAtRecord:rate,
    photos:_efPhotos,
    createdAt:existingId?DB.expenses.find(e=>e.id===existingId)?.createdAt:Date.now(),
  };
  if(existingId) DB.expenses=DB.expenses.map(e=>e.id===existingId?expense:e);
  else DB.expenses.push(expense);
  save('expenses');
  showToast(existingId?'已儲存變更':'已新增消費');
  _efCur=null;_efCatId=null;_efPayment=null;_efCardId=null;_efSubRateId=null;_efFundId=null;_efPurchaseForId=null;_efPhotos=[];_efPhotosLoadedFor=null;
  editingExpId=null; expandedPrefill=null; addSubView='quick';
  if(existingId){
    selectedTripId=tripId; switchTab('exp');
  } else { render(); }
}
window.submitExpense=submitExpense;

function renderStats() {
  const el=document.getElementById('page-stats');
  const trip=getCurrentTrip()||DB.trips.find(t=>t.id===selectedTripId)||DB.trips[0];
  if(!trip){
    el.innerHTML=`<div class="page-header"><div><div class="page-subtitle">STATISTICS</div><div class="page-title">統計</div></div></div><div class="empty-state"><div class="empty-title">尚未選擇旅程</div></div>`;
    return;
  }
  const cur=getCur(trip.currency);
  const tripExps=DB.expenses.filter(e=>e.tripId===trip.id);
  const personalExps=tripExps.filter(e=>!e.isPurchaseFor);
  const purchaseExps=tripExps.filter(e=>e.isPurchaseFor);
  const payeesList=DB.payees[0]?.items||DB.payees||[];
  const tripFunds=(DB.funds||[]).filter(f=>f.tripId===trip.id);

  // 類別（統一以台幣計算，避免混幣別旅程加總失真）
  const catMap={};
  personalExps.forEach(e=>{catMap[e.categoryId]=(catMap[e.categoryId]||0)+(e.twdAmount||0);});
  const totalAmt=Object.values(catMap).reduce((s,v)=>s+v,0);
  const catRows=Object.entries(catMap).map(([id,total])=>({cat:DB.categories.find(c=>c.id===id),total,pct:totalAmt?(total/totalAmt)*100:0}))
    .filter(x=>x.cat).sort((a,b)=>b.total-a.total);

  // 信用卡
  const cardMap={};
  personalExps.forEach(e=>{
    if(!pmRequiresCard(e.payment)||!e.cardId) return;
    const card=DB.cards.find(c=>c.id===e.cardId);
    if(!card) return;
    const sub=card.subRates?.find(s=>s.id===e.subRateId);
    const rebate=sub?(e.twdAmount||0)*(sub.rate/100):0;
    if(!cardMap[card.id]) cardMap[card.id]={card,spent:0,rebate:0};
    cardMap[card.id].spent+=e.twdAmount||0;
    cardMap[card.id].rebate+=rebate;
  });
  const cardRows=Object.values(cardMap).sort((a,b)=>b.rebate-a.rebate);
  const totalRebate=cardRows.reduce((s,c)=>s+c.rebate,0);

  // 代購
  const payeeMap={};
  purchaseExps.forEach(e=>{const k=e.purchaseForId||'unspec';payeeMap[k]=(payeeMap[k]||0)+(e.amount||0);});

  el.innerHTML=`
    <div class="page-header"><div><div class="page-subtitle">${trip.name}</div><div class="page-title">統計</div></div></div>

    <div style="font-size:11px;color:var(--faint);letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px">類別分布</div>
    ${catRows.length===0?`<div style="font-size:12px;color:var(--faint);padding:12px 0 24px">尚無資料</div>`:`
    <div style="margin-bottom:28px">
      ${catRows.map(({cat,total,pct})=>`
        <div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-light)">
          <span style="width:18px;height:18px;display:inline-flex;color:var(--sub)">${ico(cat.icon,18)}</span>
          <div style="flex:1">
            <div style="display:flex;justify-content:space-between;margin-bottom:5px">
              <span style="font-size:14px;font-weight:600">${cat.name}</span>
              <span style="font-size:14px;font-weight:700">NT$ ${fmtNum(total)}</span>
            </div>
            <div class="stat-bar"><div class="stat-bar-fill" style="width:${pct}%"></div></div>
          </div>
          <span style="font-size:11px;color:var(--faint);width:32px;text-align:right">${pct.toFixed(0)}%</span>
        </div>`).join('')}
    </div>`}

    <div style="font-size:11px;color:var(--faint);letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px">信用卡回饋</div>
    ${cardRows.length===0?`<div style="font-size:12px;color:var(--faint);padding:12px 0 24px">尚無刷卡紀錄</div>`:`
    <div style="margin-bottom:28px">
      ${cardRows.map(({card,spent,rebate})=>`
        <div style="display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line-light)">
          <div><div style="font-size:14px;font-weight:600">${card.name}</div><div style="font-size:11px;color:var(--faint);margin-top:2px">刷卡 NT$${fmtNum(spent)}</div></div>
          <span style="font-size:15px;font-weight:700;color:var(--green)">+NT$${fmtNum(rebate)}</span>
        </div>`).join('')}
      <div style="display:flex;justify-content:space-between;padding:14px 0 0">
        <span style="font-size:13px;font-weight:700">總回饋</span>
        <span style="font-size:19px;font-weight:700;color:var(--green)">NT$ ${fmtNum(totalRebate)}</span>
      </div>
    </div>`}

    ${tripFunds.length?`
    <div style="font-size:11px;color:var(--faint);letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px">公基金</div>
    <div style="margin-bottom:28px">
      ${tripFunds.map(fund=>{
        const info=getFundInfo(fund,tripExps,null);
        return `<div style="display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line-light)">
          <div><div style="font-size:14px;font-weight:600">${fund.name}</div><div style="font-size:11px;color:var(--faint);margin-top:2px">入金 ${cur.code}${fmtNum(info.totalIn)} · 已花 ${cur.code}${fmtNum(info.spent)}</div></div>
          <span style="font-size:15px;font-weight:700;color:${info.remaining<0?'var(--red)':'var(--text)'}">${cur.code} ${fmtNum(info.remaining)}</span>
        </div>`;
      }).join('')}
    </div>`:''}

    <div style="font-size:11px;color:var(--faint);letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px">代購清單</div>
    ${Object.keys(payeeMap).length===0?`<div style="font-size:12px;color:var(--faint);padding:12px 0">尚無代購紀錄</div>`:`
    ${Object.entries(payeeMap).map(([id,total])=>{
      const p=id==='unspec'?{name:'未指定'}:payeesList.find(x=>x.id===id);
      if(!p) return '';
      return `<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line-light)">
        <span style="font-size:14px;font-weight:600">${p.name}</span>
        <span style="font-size:14px;font-weight:700">${cur.code} ${fmtNum(total)}</span>
      </div>`;
    }).join('')}`}`;
}

function exportCSV() {
  const trip=DB.trips.find(t=>t.status==='active')||DB.trips[0];
  const exps=DB.expenses;
  if(!exps.length){ showToast('尚無消費紀錄'); return; }

  const headers=['日期','時間','旅程','項目名稱','金額','幣別','台幣金額','類別','支付方式','信用卡','店家','地點','備註'];
  const rows=exps.map(e=>{
    const t=DB.trips.find(t=>t.id===e.tripId);
    const cat=DB.categories.find(c=>c.id===e.categoryId);
    const card=DB.cards.find(c=>c.id===e.cardId);
    const pm=DB.paymentMethods.find(p=>p.id===e.payment);
    return [
      e.date||'',
      e.time||'',
      t?.name||'',
      e.name||'',
      e.amount||0,
      e.currency||'',
      Math.round(e.twdAmount||0),
      cat?.name||'',
      pm?.name||e.payment||'',
      card?.name||'',
      e.store||'',
      e.location||'',
      e.note||'',
    ].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',');
  });

  const csv='\uFEFF'+[headers.map(h=>`"${h}"`).join(','),...rows].join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`旅遊記帳_${todayISO()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('已匯出 '+exps.length+' 筆');
}
window.exportCSV=exportCSV;

function importCSV(event) {
  const file=event.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    try {
      const text=e.target.result.replace(/^\uFEFF/,'');
      const lines=text.split(/\r?\n/).filter(l=>l.trim());
      if(lines.length<2){ showToast('CSV 格式錯誤'); return; }

      const headers=parseCSVRow(lines[0]);
      const idx={
        date:headers.indexOf('日期'),
        time:headers.indexOf('時間'),
        trip:headers.indexOf('旅程'),
        name:headers.indexOf('項目名稱'),
        amount:headers.indexOf('金額'),
        currency:headers.indexOf('幣別'),
        twd:headers.indexOf('台幣金額'),
        cat:headers.indexOf('類別'),
        payment:headers.indexOf('支付方式'),
        store:headers.indexOf('店家'),
        location:headers.indexOf('地點'),
        note:headers.indexOf('備註'),
      };

      let imported=0, skipped=0;
      lines.slice(1).forEach(line=>{
        if(!line.trim()) return;
        const cols=parseCSVRow(line);
        const tripName=cols[idx.trip]||'';
        const trip=DB.trips.find(t=>t.name===tripName)||DB.trips.find(t=>t.status==='active')||DB.trips[0];
        if(!trip){ skipped++; return; }

        const catName=cols[idx.cat]||'';
        const cat=DB.categories.find(c=>c.name===catName);
        const pmName=cols[idx.payment]||'';
        const pm=DB.paymentMethods.find(p=>p.name===pmName);

        const amt=parseFloat(cols[idx.amount])||0;
        const twd=parseFloat(cols[idx.twd])||amt;
        const currency=cols[idx.currency]||trip.currency;

        DB.expenses.push({
          id:uid('exp'),
          tripId:trip.id,
          name:cols[idx.name]||'',
          amount:amt,
          currency,
          twdAmount:twd,
          date:cols[idx.date]||todayISO(),
          time:cols[idx.time]||'00:00',
          categoryId:cat?.id||null,
          payment:pm?.id||'other',
          cardId:null,
          subRateId:null,
          fundId:null,
          store:cols[idx.store]||'',
          location:cols[idx.location]||'',
          note:cols[idx.note]||'',
          isPurchaseFor:false,
          purchaseForId:null,
          rateAtRecord:null,
          createdAt:Date.now(),
        });
        imported++;
      });

      save('expenses');
      const msg=document.getElementById('csv-msg');
      if(msg){
        msg.style.display='block';
        msg.textContent=`✓ 匯入 ${imported} 筆${skipped?`，${skipped} 筆找不到對應旅程略過`:''}`;
      }
      showToast(`匯入 ${imported} 筆！`);
      event.target.value='';
    } catch(err) {
      showToast('匯入失敗：'+err.message);
    }
  };
  reader.readAsText(file,'utf-8');
}
window.importCSV=importCSV;

function parseCSVRow(line) {
  const result=[];
  let cur='', inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){
      if(inQ&&line[i+1]==='"'){ cur+='"'; i++; }
      else inQ=!inQ;
    } else if(c===','&&!inQ){
      result.push(cur.trim()); cur='';
    } else cur+=c;
  }
  result.push(cur.trim());
  return result;
}

// ---- 拖曳排序 (即時跟手指版，支援分類/信用卡兩種清單) ----
function dragRowsFor(kind){ return document.querySelectorAll(kind==='card'?'#drag-card-list .drag-row':kind==='pm'?'#drag-pm-list .drag-row':'#drag-cat-list .drag-row'); }
function reorderByKind(kind,from,to){ kind==='card'?reorderCard(from,to):kind==='pm'?reorderPm(from,to):reorderCat(from,to); }

let dragIdx=null, dragOverIdx=null, dragKind='cat';
function dragStart(i,kind='cat'){dragIdx=i;dragKind=kind;}
function dragOver(e,i,kind='cat'){e.preventDefault();dragOverIdx=i;dragRowsFor(kind).forEach((r,j)=>r.classList.toggle('drag-over',j===i&&i!==dragIdx));}
function dragDrop(i,kind='cat'){reorderByKind(kind,dragIdx,i);dragIdx=null;dragOverIdx=null;}
function dragEnd(kind='cat'){dragRowsFor(kind).forEach(r=>r.classList.remove('dragging','drag-over'));dragIdx=null;dragOverIdx=null;}
window.dragStart=dragStart;window.dragOver=dragOver;window.dragDrop=dragDrop;window.dragEnd=dragEnd;

// Touch拖曳 - 即時跟手指移動
let _tDragIdx=null, _tDragRows=[], _tDragOver=null, _tDragTimer=null, _tDragKind='cat';
let _tDragEl=null, _tDragClone=null, _tDragOffsetY=0, _tDragRowH=0;

function touchDragStart(e,i,kind='cat'){
  if(e.target.closest('button')) return;
  const startY=e.touches[0].clientY;
  let cancelled=false;

  function onEarlyMove(ev){
    if(Math.abs(ev.touches[0].clientY-startY)>8){
      cancelled=true;
      clearTimeout(_tDragTimer);
      document.removeEventListener('touchmove',onEarlyMove);
    }
  }
  document.addEventListener('touchmove',onEarlyMove,{passive:true});

  _tDragTimer=setTimeout(()=>{
    document.removeEventListener('touchmove',onEarlyMove);
    if(cancelled) return;

    _tDragKind=kind;
    _tDragIdx=i;
    _tDragRows=Array.from(dragRowsFor(kind));
    _tDragEl=_tDragRows[i];
    if(!_tDragEl) return;

    const rect=_tDragEl.getBoundingClientRect();
    _tDragRowH=rect.height;
    _tDragOffsetY=startY-rect.top;

    // 建立浮動 clone
    _tDragClone=_tDragEl.cloneNode(true);
    _tDragClone.style.cssText=`
      position:fixed;left:${rect.left}px;top:${rect.top}px;
      width:${rect.width}px;height:${rect.height}px;
      background:var(--card);border-radius:12px;
      box-shadow:0 8px 24px rgba(0,0,0,0.15);
      z-index:999;pointer-events:none;
      display:flex;align-items:center;padding:12px 0;
      transform:scale(1.03);opacity:0.95;
      transition:box-shadow .15s;
    `;
    document.body.appendChild(_tDragClone);

    // 原行變透明
    _tDragEl.style.opacity='0.3';

    document.addEventListener('touchmove',_touchDragMove,{passive:false});
    document.addEventListener('touchend',_touchDragEnd,{once:true});
  },250);

  document.addEventListener('touchend',()=>{
    clearTimeout(_tDragTimer);
    document.removeEventListener('touchmove',onEarlyMove);
  },{once:true});
}

function _touchDragMove(e){
  if(_tDragIdx===null||!_tDragClone) return;
  e.preventDefault();
  const y=e.touches[0].clientY;

  // clone 跟手指走
  _tDragClone.style.top=(y-_tDragOffsetY)+'px';

  // 找當前在哪一行上方
  let over=null;
  _tDragRows.forEach((el,idx)=>{
    if(idx===_tDragIdx) return;
    const r=el.getBoundingClientRect();
    const mid=r.top+r.height/2;
    if(y>r.top&&y<r.bottom) over=idx;
  });

  if(over!==null&&over!==_tDragOver){
    _tDragOver=over;
    // 即時視覺重排：其他行加上 translateY
    _tDragRows.forEach((el,idx)=>{
      el.style.transition='transform .15s ease';
      if(idx===_tDragIdx){ el.style.transform=''; return; }
      if(_tDragIdx<_tDragOver){
        // 往下拖：中間的往上移
        el.style.transform=(idx>_tDragIdx&&idx<=_tDragOver)?`translateY(-${_tDragRowH}px)`:'';
      } else {
        // 往上拖：中間的往下移
        el.style.transform=(idx>=_tDragOver&&idx<_tDragIdx)?`translateY(${_tDragRowH}px)`:'';
      }
    });
  }
}

function _touchDragEnd(){
  document.removeEventListener('touchmove',_touchDragMove);

  // 移除 clone
  if(_tDragClone){ _tDragClone.remove(); _tDragClone=null; }

  // 重置所有 row 樣式
  _tDragRows.forEach(el=>{
    el.style.transform='';
    el.style.transition='';
    el.style.opacity='';
  });

  if(_tDragIdx!==null&&_tDragOver!==null&&_tDragIdx!==_tDragOver){
    reorderByKind(_tDragKind,_tDragIdx,_tDragOver);
  }
  _tDragIdx=null;_tDragOver=null;_tDragRows=[];_tDragEl=null;
}
window.touchDragStart=touchDragStart;

function reorderCat(from,to){
  if(from===null||to===null||from===to) return;
  const arr=[...DB.categories];
  const [moved]=arr.splice(from,1);
  arr.splice(to,0,moved);
  DB.categories=arr; save('categories');
  document.getElementById('drag-cat-list').innerHTML=buildDragCatList();
}

function reorderCard(from,to){
  if(from===null||to===null||from===to) return;
  const arr=[...DB.cards];
  const [moved]=arr.splice(from,1);
  arr.splice(to,0,moved);
  DB.cards=arr; save('cards');
  document.getElementById('drag-card-list').innerHTML=buildDragCardList();
}

function buildSubRateRow(sub, allSubs){
  allSubs = allSubs || [];
  const rate=(sub.rate===0||sub.rate===''||sub.rate===undefined)?'':sub.rate;
  const limit=sub.unlimited?'':(sub.limit==null||sub.limit===0||sub.limit===''||sub.limit===undefined)?'':sub.limit;
  const used=(sub.used===0||sub.used===''||sub.used===undefined)?'':sub.used;
  const unlimited=sub.unlimited||false;
  const sharing=!!sub.shareWithId;
  const shareOpts=allSubs.filter(s=>s.id!==sub.id);
  const shareOptsHtml=shareOpts.length
    ? shareOpts.map(o=>`<option value="${o.id}" ${o.id===sub.shareWithId?'selected':''}>${o.name||'（未命名方案）'}</option>`).join('')
    : `<option value="">（請先新增其他方案）</option>`;
  return `<div id="sr-row-${sub.id}" data-share-with="${sub.shareWithId||''}" style="margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--line-light)">
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input class="field-input" id="sr-name-${sub.id}" value="${sub.name||''}" placeholder="方案名稱（例：海外消費）" style="flex:1;font-size:14px;font-weight:600">
      <button onclick="removeSubRateRow('${sub.id}')" style="background:none;border:none;cursor:pointer;color:var(--faint)">${ico('x',16)}</button>
    </div>
    <div style="display:flex;gap:20px;align-items:flex-end;margin-bottom:${sharing?'0':'12px'}">
      <div style="flex:1">
        <div style="font-size:10px;color:var(--faint);margin-bottom:4px">回饋%</div>
        <input type="number" inputmode="decimal" id="sr-rate-${sub.id}" value="${rate}" class="field-input" style="font-size:14px">
      </div>
      <div style="flex:1.6" id="sr-limit-wrap-${sub.id}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
          <div style="font-size:10px;color:var(--faint)">上限(NT$)</div>
          <label style="display:flex;align-items:center;gap:4px;cursor:pointer">
            <input type="checkbox" id="sr-unlimited-${sub.id}" ${unlimited?'checked':''} onchange="toggleUnlimited('${sub.id}')" style="width:12px;height:12px;accent-color:var(--accent)">
            <span style="font-size:10px;color:var(--sub)">無上限</span>
          </label>
        </div>
        <input type="number" inputmode="decimal" id="sr-limit-${sub.id}" value="${limit}" class="field-input" style="font-size:14px;opacity:${(unlimited||sharing)?'0.3':'1'}" ${(unlimited||sharing)?'disabled':''}>
      </div>
      <div style="flex:1" id="sr-used-wrap-${sub.id}">
        <div style="font-size:10px;color:var(--faint);margin-bottom:4px">已用(NT$)</div>
        <input type="number" inputmode="decimal" id="sr-used-${sub.id}" value="${used}" class="field-input" style="font-size:14px;opacity:${sharing?'0.3':'1'}" ${sharing?'disabled':''}>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;${sharing?'margin-bottom:8px':''}">
      <span style="font-size:11.5px;color:var(--sub);font-weight:600">與其他方案共用額度</span>
      <label class="switch-toggle"><input type="checkbox" id="sr-share-toggle-${sub.id}" ${sharing?'checked':''} onchange="toggleShareLimit('${sub.id}')"><span></span></label>
    </div>
    <div id="sr-share-wrap-${sub.id}" style="display:${sharing?'block':'none'}">
      <select id="sr-share-${sub.id}" class="field-input" style="font-size:13px">${sharing?shareOptsHtml:''}</select>
      <div style="font-size:10.5px;color:var(--faint);line-height:1.6;margin-top:6px">開啟後這個方案不用自己填上限，會跟選擇的對象共用同一包額度，花費一起累計。</div>
    </div>
  </div>`;
}

function refreshShareOptions(excludeId){
  // 收集目前表單上所有方案（含尚未儲存的新增列），作為共用對象的候選清單
  const rows=Array.from(document.querySelectorAll('[id^="sr-row-"]'));
  return rows
    .filter(row=>row.id!==`sr-row-${excludeId}`)
    .map(row=>{
      const id=row.id.replace('sr-row-','');
      const name=document.getElementById(`sr-name-${id}`)?.value.trim()||'（未命名方案）';
      return {id,name};
    });
}

function toggleShareLimit(subId){
  const cb=document.getElementById(`sr-share-toggle-${subId}`);
  const wrap=document.getElementById(`sr-share-wrap-${subId}`);
  const limitInput=document.getElementById(`sr-limit-${subId}`);
  const usedInput=document.getElementById(`sr-used-${subId}`);
  const unlimitedChecked=document.getElementById(`sr-unlimited-${subId}`)?.checked||false;
  if(!cb||!wrap) return;
  wrap.style.display=cb.checked?'block':'none';
  if(limitInput){ limitInput.disabled=cb.checked||unlimitedChecked; limitInput.style.opacity=(cb.checked||unlimitedChecked)?'0.3':'1'; }
  if(usedInput){ usedInput.disabled=cb.checked; usedInput.style.opacity=cb.checked?'0.3':'1'; }
  if(cb.checked){
    const opts=refreshShareOptions(subId);
    const select=document.getElementById(`sr-share-${subId}`);
    const currentVal=document.getElementById(`sr-row-${subId}`)?.dataset.shareWith||'';
    if(select){
      select.innerHTML=opts.length
        ? opts.map(o=>`<option value="${o.id}" ${o.id===currentVal?'selected':''}>${o.name}</option>`).join('')
        : `<option value="">（請先新增其他方案）</option>`;
    }
  }
}
window.toggleShareLimit=toggleShareLimit;

function toggleUnlimited(subId){
  const cb=document.getElementById(`sr-unlimited-${subId}`);
  const limitInput=document.getElementById(`sr-limit-${subId}`);
  const sharing=document.getElementById(`sr-share-toggle-${subId}`)?.checked||false;
  if(!cb||!limitInput) return;
  limitInput.disabled=cb.checked||sharing;
  limitInput.style.opacity=(cb.checked||sharing)?'0.3':'1';
  if(cb.checked) limitInput.value='';
}
window.toggleUnlimited=toggleUnlimited;

let _tempSubIds=[];
function addSubRateRow(){
  const newSub={id:uid('sub'),name:'',rate:'',limit:'',used:'',unlimited:false,shareWithId:null};
  _tempSubIds.push(newSub.id);
  document.getElementById('subrate-rows').insertAdjacentHTML('beforeend',buildSubRateRow(newSub));
}

function submitCard(existingId){
  const name=document.getElementById('card-name')?.value.trim();
  if(!name){showToast('請填寫卡片名稱');return;}
  const rows=document.querySelectorAll('[id^="sr-row-"]');
  const subRates=[];
  rows.forEach(row=>{
    const id=row.id.replace('sr-row-','');
    const n=document.getElementById(`sr-name-${id}`)?.value.trim();
    if(!n) return;
    const isUnlimited=document.getElementById(`sr-unlimited-${id}`)?.checked||false;
    const isSharing=document.getElementById(`sr-share-toggle-${id}`)?.checked||false;
    const shareWithId=isSharing?(document.getElementById(`sr-share-${id}`)?.value||null):null;
    subRates.push({
      id, name:n,
      rate:parseFloat(document.getElementById(`sr-rate-${id}`)?.value)||0,
      unlimited:isUnlimited,
      limit:isUnlimited?Infinity:(parseFloat(document.getElementById(`sr-limit-${id}`)?.value)||null),
      used:isSharing?0:(parseFloat(document.getElementById(`sr-used-${id}`)?.value)||0),
      shareWithId:shareWithId||null,
    });
  });
  const card={id:existingId||uid('card'),name,subRates};
  if(existingId) DB.cards=DB.cards.map(c=>c.id===existingId?card:c);
  else DB.cards.push(card);
  save('cards'); _tempSubIds=[];
  showToast(existingId?'已儲存變更':'已新增信用卡');
  navStack.settings='main'; render();
}
window.submitCard=submitCard;

}

    // 確保網址帶有代碼參數
    const params = new URLSearchParams(location.search);
    if(params.get('code')!==syncCode) {
      history.replaceState(null, '', location.pathname + '?code=' + encodeURIComponent(syncCode));
    }
    document.getElementById('sync-login').style.display='none';
    document.getElementById('app').style.display='';
    switchTab('add');
    // 背景拉取雲端最新資料（如果 Supabase 可用）
    if(sb) {
      sb.from('app_data').select('data').eq('sync_code', syncCode).maybeSingle().then(({data,error})=>{
        if(!error && data) {
          const cloud=data.data||{};
          DB.trips = cloud.trips || DB.trips;
          DB.expenses = cloud.expenses || DB.expenses;
          DB.cards = cloud.cards || DB.cards;
          DB.categories = (cloud.categories&&cloud.categories.length) ? cloud.categories : DB.categories;
          DB.payees = cloud.payees || DB.payees;
          DB.funds = cloud.funds || DB.funds;
          DB.theme = cloud.theme || DB.theme;
          DB.paymentMethods = (cloud.paymentMethods&&cloud.paymentMethods.length) ? cloud.paymentMethods : DB.paymentMethods;
          ['trips','expenses','cards','categories','payees','funds','theme','paymentMethods'].forEach(k=>lsSet(k,DB[k]));
          applyTheme(DB.theme);
          render();
        }
      }).catch(e=>console.error('背景同步失敗',e));
    }
  } else {
    document.getElementById('sync-login').style.display='flex';
  }
}
initApp();


</script>
</body>
</html>
